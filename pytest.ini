[pytest]
# Указываем корневую папку для поиска модулей приложения
pythonpath = .

# Шаблоны названий тестовых файлов, классов и методов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Автоматически маркировать все асинхронные тесты (больше не нужно писать @pytest.mark.asyncio)
asyncio_mode = auto

# Настройка дефолтного event loop (strict гарантирует изоляцию)
asyncio_default_fixture_loop_scope = function
