version: '3.8'

services:
  chat_app_dev:
    build: .
    container_name: chat_dev
    ports:
      - "8000:8000"
    profiles: ["app"]
    volumes:
      - .:/app

  redis_dev:
    image: redis:5-alpine
    container_name: redis_dev
    restart: always
    ports:
      - "${REDIS__PORT}:6379"
    command: redis-server --requirepass ${REDIS__PASSWORD} --appendonly yes

  postgres_dev:
    image: postgres:17-alpine
    container_name: postgres_dev
    restart: always
    ports:
      - "${POSTGRES__PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DB}
      TZ: UTC
      PGTZ: UTC
    command: >
      postgres
      -c timezone=UTC
      -c log_timezone=UTC

  pgadmin_dev:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_panel_dev
    restart: always
    ports:
      - "5045:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres

  mongodb_dev:
    image: mongo:latest
    container_name: mongodb_dev
    restart: always
    ports:
      - "${MONGODB__PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB__USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB__PASSWORD}