version: '3.8'

services:
  chat_app_dev:
    build: .
    container_name: chat_dev
    ports:
      - "8000:8000"
    profiles: ["app"]
    volumes:
      - .:/app

  redis_dev:
    image: redis:5-alpine
    container_name: redis_dev
    restart: always
    ports:
      - "${REDIS__PORT}:6379"
    command: redis-server --requirepass ${REDIS__PASSWORD} --appendonly yes
    networks:
      - chat_network

  postgres_dev:
    image: postgres:17-alpine
    container_name: postgres_dev
    restart: always
    ports:
      - "${POSTGRES__PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DB}
      TZ: UTC
      PGTZ: UTC
    command: >
      postgres
      -c timezone=UTC
      -c log_timezone=UTC
    networks:
      - chat_network

  pgadmin_dev:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_panel_dev
    restart: always
    ports:
      - "5045:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres

  mongodb_dev:
    image: mongo:latest
    container_name: mongodb_dev
    restart: always
    ports:
      - "${MONGODB__PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB__USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB__PASSWORD}
    networks:
      - chat_network

  mongo-express-dev:
    image: mongo-express:latest
    container_name: mongo-express-dev
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:qwerty@mongodb_dev:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass8081
    depends_on:
      - mongodb_dev
    networks:
      - chat_network



networks:
  chat_network:
    driver: bridge