version: '3.8'

services:
  redis_test:
    image: redis:5-alpine
    container_name: redis_test
    restart: always
    ports:
      - "${REDIS__PORT}:6379"
    command: redis-server --requirepass ${REDIS__PASSWORD} --appendonly yes

  postgres_test:
    image: postgres:17-alpine
    container_name: postgres_test
    restart: always
    ports:
      - "${POSTGRES__PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DB}
      TZ: UTC
      PGTZ: UTC
    command: >
      postgres
      -c timezone=UTC
      -c log_timezone=UTC

  mongodb_test:
    image: mongo:latest
    container_name: mongodb_test
    restart: always
    ports:
      - "${MONGODB__PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB__USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB__PASSWORD}